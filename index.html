
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>RegiFlow | Registration Form</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

</head>


<body class="bg-light">


    <!-- Navbar -->

    <nav
        class="navbar navbar-expand-lg shadow-sm"
        style="background-color: #6F42C1;"
    >

        <div class="container-fluid">


            <!-- Logo -->

            <a
                class="navbar-brand d-flex align-items-center text-white"
                href="#"
            >

                <img
                    src="./static/Purple Registration Form Logo.png"
                    alt="RegiFlow Logo"
                    height="40"
                    class="me-2"
                />

                <span class="fw-bold fs-4">
                    RegiFlow
                </span>

            </a>


            <!-- Navbar Title -->

            <span class="navbar-text text-white">

                Registration Form

            </span>


        </div>

    </nav>



    <!-- Main Container -->

    <div class="container my-4">


        <div class="row g-4">


            <!-- Registration Form -->

            <div class="col-md-5">


                <!-- Heading -->

                <h5
                    class="text-center text-white p-3 rounded mb-3"
                    style="background-color: #6F42C1;"
                >

                    Register Your Details

                </h5>



                <!-- Form -->

                <form id="registerform">


                    <!-- Name -->

                    <div class="form-group">

                        <input
                            type="text"
                            class="form-control mb-3"
                            name="name"
                            id="name"
                            placeholder="Enter Your Name"
                            minlength="2"
                            required
                        />

                    </div>



                    <!-- Email -->

                    <div class="form-group">

                        <input
                            type="email"
                            class="form-control mb-3"
                            name="email"
                            id="email"
                            placeholder="Enter Your Email"
                            required
                        />

                    </div>



                    <!-- Aadhaar -->

                    <div class="form-group">

                        <input
                            type="text"
                            class="form-control mb-3"
                            name="adhar"
                            id="adhar"
                            placeholder="Enter Your Aadhaar Card Number"
                            maxlength="12"
                            pattern="[0-9]{12}"
                            inputmode="numeric"
                            required
                        />

                    </div>



                    <!-- Gender -->

                    <div class="mb-3">


                        <!-- Male -->

                        <div class="form-check form-check-inline">

                            <input
                                type="radio"
                                class="form-check-input"
                                name="type"
                                id="male"
                                value="male"
                                required
                            />

                            <label
                                class="form-check-label"
                                for="male"
                            >

                                Male

                            </label>

                        </div>



                        <!-- Female -->

                        <div class="form-check form-check-inline">

                            <input
                                type="radio"
                                class="form-check-input"
                                name="type"
                                id="female"
                                value="female"
                            />

                            <label
                                class="form-check-label"
                                for="female"
                            >

                                Female

                            </label>

                        </div>


                    </div>



                    <!-- Submit Button -->

                    <div class="d-grid gap-2">

                        <button
                            type="submit"
                            class="btn text-white"
                            style="background-color: #6F42C1;"
                        >

                            Submit

                        </button>

                    </div>


                </form>


            </div>




            <!-- View Details -->

            <div class="col-md-7">


                <!-- Message -->

                <div id="showmessage"></div>



                <!-- Heading -->

                <h5
                    class="text-center text-white p-3 rounded mb-3"
                    style="background-color: #6F42C1;"
                >

                    View Details

                </h5>



                <!-- Search -->

                <div class="row">


                    <div class="col-md-7"></div>



                    <div class="col-md-5">


                        <form
                            class="d-flex"
                            role="search"
                            id="searchForm"
                        >


                            <input
                                class="form-control me-2"
                                type="search"
                                id="searchInput"
                                placeholder="Search"
                                aria-label="Search"
                            />


                            <button
                                class="btn btn-outline-primary"
                                type="submit"
                            >

                                Search

                            </button>


                        </form>


                    </div>


                </div>



                <br />



                <!-- Registration Table -->

                <div class="table-responsive">


                    <table class="table table-hover">


                        <!-- Table Heading -->

                        <thead
                            class="text-white"
                            style="background-color: #6F42C1;"
                        >


                            <tr>

                                <th scope="col">
                                    Name
                                </th>

                                <th scope="col">
                                    Email
                                </th>

                                <th scope="col">
                                    Aadhaar
                                </th>

                                <th scope="col">
                                    Gender
                                </th>

                            </tr>


                        </thead>



                        <!-- Table Body -->

                        <tbody id="tableBody">


                        </tbody>


                    </table>


                </div>


            </div>


        </div>


    </div>



    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>



    <!-- RegiFlow JavaScript -->

    <script src="./scriptes6.js"></script>


</body>

</html>
